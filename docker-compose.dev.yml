# Kima Dev Services
# Run alongside npm dev servers for audio analysis
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#
# This runs:
#   - PostgreSQL (port 5433)
#   - Redis (port 6379)
#   - Audio Analyzer with ML models (Enhanced vibe matching)

services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: kima_dev_db
        environment:
            POSTGRES_USER: kima
            POSTGRES_PASSWORD: kima
            POSTGRES_DB: kima
        volumes:
            - postgres_dev_data:/var/lib/postgresql/data
        ports:
            - "5433:5432"
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U kima -d kima"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: kima_dev_redis
        ports:
            - "6380:6379"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Audio Analyzer - Essential with ML models for Enhanced vibe matching
    audio-analyzer:
        build:
            context: ./services/audio-analyzer
        container_name: kima_audio_analyzer
        environment:
            # Connect to the compose Postgres/Redis via their service names
            REDIS_URL: redis://redis:6379
            DATABASE_URL: postgresql://kima:kima@postgres:5432/kima
            # Music path inside container (mounted from host)
            MUSIC_PATH: /music
            BATCH_SIZE: 10
            SLEEP_INTERVAL: 5
            BRPOP_TIMEOUT: 10
            MODEL_IDLE_TIMEOUT: 60
        volumes:
            - "${MUSIC_PATH:-./music}:/music:ro"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    audio-analyzer-clap:
        build:
            context: ./services/audio-analyzer-clap
        container_name: kima_audio_analyzer_clap
        env_file:
            - .env
        environment:
            REDIS_URL: redis://redis:6379
            DATABASE_URL: postgresql://kima:kima@postgres:5432/kima
            # Backend runs on the host during dev, reach it via the docker host gateway
            BACKEND_URL: http://host.docker.internal:3006
            MUSIC_PATH: /music
            SLEEP_INTERVAL: 5
            NUM_WORKERS: 2
            THREADS_PER_WORKER: 1
            MODEL_IDLE_TIMEOUT: 300
            INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-kima-internal-secret-change-me}
        volumes:
            - "${MUSIC_PATH:-./music}:/music:ro"
        # Lets the container resolve host.docker.internal to the host machine (Linux)
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

volumes:
    postgres_dev_data:
