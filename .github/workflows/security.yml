name: Security Checks

# Two jobs with different costs. The dependency scan takes seconds and runs on
# every pull request. The security end-to-end suite builds the whole image, boots
# it and drives it with a browser, so it runs weekly and on demand.

on:
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 2 * * 0"
    workflow_dispatch:

jobs:
    dependency-audit:
        name: Dependency & Secret Scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Trivy reads both lockfiles and the Python requirements in one pass,
            # and finds committed secrets at the same time.
            - name: Install Trivy
              uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
              with:
                  version: v0.74.0
                  cache: true

            # Blocks on anything HIGH or CRITICAL that has a fix published --
            # i.e. anything you could actually do something about. Findings with
            # no fix are printed by the next step instead of failing the build;
            # deliberate exceptions live in .trivyignore with a reason.
            - name: Dependencies and secrets -- fixable HIGH/CRITICAL blocks
              run: |
                  trivy fs \
                    --scanners vuln,secret \
                    --severity HIGH,CRITICAL \
                    --ignore-unfixed \
                    --ignorefile .trivyignore \
                    --exit-code 1 \
                    --format table \
                    .

            - name: Full report, including findings with no fix (never blocks)
              if: always()
              run: |
                  trivy fs \
                    --scanners vuln,secret \
                    --severity HIGH,CRITICAL \
                    --exit-code 0 \
                    --format table \
                    . >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

            # Dockerfile and compose misconfiguration. Reported, not gated: the
            # release image runs as root on purpose -- it starts Postgres and
            # Redis itself and drops to their users with gosu -- so the headline
            # finding here is a design decision, not a defect.
            - name: Container configuration (report only)
              if: always()
              run: |
                  trivy config \
                    --severity HIGH,CRITICAL \
                    --exit-code 0 \
                    --format table \
                    . >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

    security-e2e:
        name: Security E2E Tests
        # Weekly and on demand only: a pull request already builds this image in
        # pr-checks.yml.
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v4

            - name: Build image, start stack, create test user, install Playwright
              uses: ./.github/actions/e2e-stack
              with:
                  tag: security
                  container: kima-security
                  volume: kima_security_data

            - name: Run security spec
              working-directory: frontend
              run: npx playwright test tests/e2e/security.spec.ts --reporter=list
              env:
                  KIMA_TEST_USERNAME: ${{ env.KIMA_TEST_USERNAME }}
                  KIMA_TEST_PASSWORD: ${{ env.KIMA_TEST_PASSWORD }}
                  KIMA_UI_BASE_URL: http://127.0.0.1:3080

            - name: Upload results on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: security-test-results-${{ github.run_id }}
                  path: frontend/test-results/
                  retention-days: 7

            - name: Stop stack
              if: always()
              uses: ./.github/actions/e2e-teardown
              with:
                  container: kima-security
                  volume: kima_security_data
