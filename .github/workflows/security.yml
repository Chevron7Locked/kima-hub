name: Security Checks

# Two jobs with very different costs, so they run on different schedules.
#
# The dependency scan is seconds and runs on every pull request -- it is the one
# you want in front of a merge.
#
# The security end-to-end suite builds the whole image, boots it and drives it
# with a browser. It used to run on every pull request too, which meant every PR
# built the same image TWICE: once here and once in pr-checks.yml. It now runs on
# the weekly schedule and on demand, where the cost is worth paying.

on:
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 2 * * 0"
    workflow_dispatch:

jobs:
    dependency-audit:
        name: Dependency & Secret Scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Replaces `npm audit --audit-level=critical`, which was set to a
            # threshold that caught nothing: the repo carried 36 high-severity
            # advisories and zero critical ones, so this job passed clean every
            # week while Next.js sat on eleven of them.
            #
            # Trivy reads both lockfiles and the Python requirements in one pass,
            # and finds committed secrets at the same time.
            - name: Install Trivy
              uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
              with:
                  version: v0.74.0
                  cache: true

            # Blocks on anything HIGH or CRITICAL that has a fix published --
            # i.e. anything you could actually do something about. Findings with
            # no fix are printed by the next step instead of failing the build;
            # deliberate exceptions live in .trivyignore with a reason.
            - name: Dependencies and secrets -- fixable HIGH/CRITICAL blocks
              run: |
                  trivy fs \
                    --scanners vuln,secret \
                    --severity HIGH,CRITICAL \
                    --ignore-unfixed \
                    --ignorefile .trivyignore \
                    --exit-code 1 \
                    --format table \
                    .

            - name: Full report, including findings with no fix (never blocks)
              if: always()
              run: |
                  trivy fs \
                    --scanners vuln,secret \
                    --severity HIGH,CRITICAL \
                    --exit-code 0 \
                    --format table \
                    . >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

            # Dockerfile and compose misconfiguration. Reported, not gated: the
            # release image runs as root on purpose -- it starts Postgres and
            # Redis itself and drops to their users with gosu -- so the headline
            # finding here is a design decision, not a defect.
            - name: Container configuration (report only)
              if: always()
              run: |
                  trivy config \
                    --severity HIGH,CRITICAL \
                    --exit-code 0 \
                    --format table \
                    . >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

    security-e2e:
        name: Security E2E Tests
        # Weekly and on demand only. On a pull request this was a second full
        # image build of the exact image pr-checks.yml had already built.
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: false
                  load: true
                  tags: kima:security
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Start Kima stack
              run: |
                  docker run -d \
                    --name kima-security \
                    -p 3030:3030 \
                    -p 3006:3006 \
                    -v kima_security_data:/data \
                    kima:security
                  timeout 90 bash -c 'until curl -sf http://localhost:3030/api/health; do sleep 3; done'

            - name: Create test user
              run: |
                  TEST_USER="kima_e2e"
                  TEST_PASS="$(openssl rand -hex 20)"
                  echo "::add-mask::${TEST_PASS}"
                  echo "KIMA_TEST_USERNAME=${TEST_USER}" >> "$GITHUB_ENV"
                  echo "KIMA_TEST_PASSWORD=${TEST_PASS}" >> "$GITHUB_ENV"
                  KIMA_CONTAINER=kima-security \
                  KIMA_TEST_USERNAME="${TEST_USER}" \
                  KIMA_TEST_PASSWORD="${TEST_PASS}" \
                  bash scripts/create-e2e-user.sh

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install Playwright
              working-directory: frontend
              run: |
                  npm ci
                  npx playwright install --with-deps chromium

            - name: Run security spec
              working-directory: frontend
              run: npx playwright test tests/e2e/security.spec.ts --reporter=list
              env:
                  KIMA_TEST_USERNAME: ${{ env.KIMA_TEST_USERNAME }}
                  KIMA_TEST_PASSWORD: ${{ env.KIMA_TEST_PASSWORD }}
                  KIMA_UI_BASE_URL: http://127.0.0.1:3030

            - name: Upload results on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: security-test-results-${{ github.run_id }}
                  path: frontend/test-results/
                  retention-days: 7

            - name: Stop stack
              if: always()
              run: |
                  docker stop kima-security || true
                  docker rm kima-security || true
                  docker volume rm kima_security_data || true
