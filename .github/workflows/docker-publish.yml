name: Build and Publish Docker Image

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Version tag (e.g., v1.0.0)"
                required: true
                type: string

env:
    DOCKERHUB_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/kima

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set GHCR image name
              run: |
                  OWNER="${{ github.repository_owner }}"
                  echo "GHCR_IMAGE_NAME=ghcr.io/${OWNER,,}/kima" >> $GITHUB_ENV

            - name: Free up disk space
              run: |
                  sudo rm -rf /usr/share/dotnet
                  sudo rm -rf /opt/ghc
                  sudo rm -rf /usr/local/share/boost
                  sudo rm -rf "$AGENT_TOOLSDIRECTORY"

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract version
              id: version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
                  else
                    echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
                  fi

            # ---- Vulnerability gate -------------------------------------
            # Build the Intel image on its own first and scan it before anything
            # is published. This costs almost nothing on top of the real build:
            # the multi-architecture step below reuses the identical cached
            # layers for its Intel leg.
            #
            # What blocks a release: a HIGH or CRITICAL vulnerability that has a
            # fixed version available -- something you can actually act on. What
            # does not: a finding with no fix published, because there is nothing
            # to do about it and failing on it would just teach everyone to
            # ignore this job. Those still get printed by the report step below,
            # and anything deliberately accepted goes in .trivyignore with a
            # reason attached.
            - name: Build image for scanning (amd64)
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  push: false
                  load: true
                  tags: kima:scan
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  platforms: linux/amd64

            - name: Install Trivy
              uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
              with:
                  version: v0.74.0
                  cache: true

            - name: Scan image -- fixable HIGH/CRITICAL blocks the release
              run: |
                  trivy image \
                    --scanners vuln,secret \
                    --severity HIGH,CRITICAL \
                    --ignore-unfixed \
                    --ignorefile .trivyignore \
                    --exit-code 1 \
                    --format table \
                    kima:scan

            - name: Full report, including findings with no fix (never blocks)
              if: always()
              run: |
                  trivy image \
                    --scanners vuln,secret \
                    --severity HIGH,CRITICAL \
                    --exit-code 0 \
                    --format table \
                    kima:scan >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ steps.version.outputs.version }}
                      ${{ env.DOCKERHUB_IMAGE_NAME }}:latest
                      ${{ env.GHCR_IMAGE_NAME }}:${{ steps.version.outputs.version }}
                      ${{ env.GHCR_IMAGE_NAME }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  platforms: linux/amd64,linux/arm64

    create-release:
        needs: [build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Extract version
              id: version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
                  else
                    echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
                  fi

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.version.outputs.version }}
                  name: Kima ${{ steps.version.outputs.version }}
                  body: |
                      ## Quick Start

                      ```bash
                      docker run -d \
                        --name kima \
                        -p 3030:3030 \
                        -v /path/to/your/music:/music \
                        -v kima_data:/data \
                        ${{ secrets.DOCKERHUB_USERNAME }}/kima:${{ steps.version.outputs.version }}
                      ```

                      Then open http://localhost:3030 and create your account!

                      ## Documentation

                      See the [README](https://github.com/${{ github.repository }}#readme) for full documentation.
                  draft: false
                  prerelease: false
                  generate_release_notes: true
