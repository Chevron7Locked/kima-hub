name: Build and Publish Docker Image

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Version tag (e.g., v1.0.0)"
                required: true
                type: string

env:
    DOCKERHUB_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/kima

jobs:
    build-amd64:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set GHCR image name
              run: |
                  OWNER="${{ github.repository_owner }}"
                  echo "GHCR_IMAGE_NAME=ghcr.io/${OWNER,,}/kima" >> $GITHUB_ENV

            - name: Free up disk space
              run: |
                  sudo rm -rf /usr/share/dotnet
                  sudo rm -rf /opt/ghc
                  sudo rm -rf /usr/local/share/boost
                  sudo rm -rf "$AGENT_TOOLSDIRECTORY"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to DockerHub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # A version with a suffix (v1.12.0-rc1) is a pre-release: it never moves `latest`.
            - name: Extract version
              id: version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    version="${{ inputs.version }}"
                  else
                    version="${GITHUB_REF#refs/tags/}"
                  fi
                  echo "version=${version}" >> $GITHUB_OUTPUT
                  if [[ "${version}" == *-* ]]; then echo "prerelease=true" >> $GITHUB_OUTPUT; else echo "prerelease=false" >> $GITHUB_OUTPUT; fi

            # Scan the Intel image before publishing; the digest push below reuses
            # its cached layers. Reports only: most findings are base-image packages
            # with no fix yet, and security.yml blocks on the fixable ones.
            - name: Build image for scanning (amd64)
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  push: false
                  load: true
                  tags: kima:scan
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  platforms: linux/amd64

            - name: Install Trivy
              uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
              with:
                  version: v0.76.1
                  cache: true

            - name: Scan the image (report only)
              if: always()
              run: |
                  {
                    echo '### Image scan — HIGH/CRITICAL with a fix available'
                    echo ''
                    echo '```'
                    trivy image \
                      --scanners vuln,secret \
                      --severity HIGH,CRITICAL \
                      --ignore-unfixed \
                      --ignorefile .trivyignore \
                      --exit-code 0 \
                      --format table \
                      kima:scan 2>&1
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Build and push by digest (amd64)
              id: push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64
                  outputs: type=image,name=${{ env.DOCKERHUB_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Export digest
              run: |
                  mkdir -p ${{ runner.temp }}/digests
                  digest="${{ steps.push.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v7
              with:
                  name: digests-amd64
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    build-arm64:
        runs-on: ubuntu-24.04-arm
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # Same head room the amd64 job needs: the image carries the ML
            # models and a full Postgres, so a default runner's disk fills
            # partway through the build.
            - name: Free up disk space
              run: |
                  sudo rm -rf /usr/share/dotnet
                  sudo rm -rf /opt/ghc
                  sudo rm -rf /usr/local/share/boost
                  sudo rm -rf "$AGENT_TOOLSDIRECTORY"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to DockerHub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push by digest (arm64)
              id: push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/arm64
                  outputs: type=image,name=${{ env.DOCKERHUB_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Export digest
              run: |
                  mkdir -p ${{ runner.temp }}/digests
                  digest="${{ steps.push.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v7
              with:
                  name: digests-arm64
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        needs: [build-amd64, build-arm64]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Set GHCR image name
              run: |
                  OWNER="${{ github.repository_owner }}"
                  echo "GHCR_IMAGE_NAME=ghcr.io/${OWNER,,}/kima" >> $GITHUB_ENV

            - name: Download digests
              uses: actions/download-artifact@v8
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to DockerHub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # A version with a suffix (v1.12.0-rc1) is a pre-release: it never moves `latest`.
            - name: Extract version
              id: version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    version="${{ inputs.version }}"
                  else
                    version="${GITHUB_REF#refs/tags/}"
                  fi
                  echo "version=${version}" >> $GITHUB_OUTPUT
                  if [[ "${version}" == *-* ]]; then echo "prerelease=true" >> $GITHUB_OUTPUT; else echo "prerelease=false" >> $GITHUB_OUTPUT; fi

            - name: Create manifest list and push
              working-directory: ${{ runner.temp }}/digests
              run: |
                  tags=(-t "${{ env.DOCKERHUB_IMAGE_NAME }}:${{ steps.version.outputs.version }}" -t "${{ env.GHCR_IMAGE_NAME }}:${{ steps.version.outputs.version }}")
                  if [ "${{ steps.version.outputs.prerelease }}" = "false" ]; then
                    tags+=(-t "${{ env.DOCKERHUB_IMAGE_NAME }}:latest" -t "${{ env.GHCR_IMAGE_NAME }}:latest")
                  fi
                  docker buildx imagetools create "${tags[@]}" \
                    $(printf '${{ env.DOCKERHUB_IMAGE_NAME }}@sha256:%s ' *)

            - name: Inspect image
              run: |
                  docker buildx imagetools inspect ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ steps.version.outputs.version }}

    create-release:
        needs: [merge]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # A version with a suffix (v1.12.0-rc1) is a pre-release: it never moves `latest`.
            - name: Extract version
              id: version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    version="${{ inputs.version }}"
                  else
                    version="${GITHUB_REF#refs/tags/}"
                  fi
                  echo "version=${version}" >> $GITHUB_OUTPUT
                  if [[ "${version}" == *-* ]]; then echo "prerelease=true" >> $GITHUB_OUTPUT; else echo "prerelease=false" >> $GITHUB_OUTPUT; fi

            - name: Create Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.version.outputs.version }}
                  name: Kima ${{ steps.version.outputs.version }}
                  body: |
                      ## Quick Start

                      ```bash
                      docker run -d \
                        --name kima \
                        -p 3030:3030 \
                        -v /path/to/your/music:/music \
                        -v kima_data:/data \
                        ${{ secrets.DOCKERHUB_USERNAME }}/kima:${{ steps.version.outputs.version }}
                      ```

                      Then open http://localhost:3030 and create your account!

                      ## Documentation

                      See the [README](https://github.com/${{ github.repository }}#readme) for full documentation.
                  draft: false
                  prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
                  make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'true' }}
                  generate_release_notes: true
