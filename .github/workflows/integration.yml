name: Integration Tests

on:
    pull_request:
        branches: [main]
        types: [labeled]
    workflow_dispatch:

# Keyed by label too, so adding some other label (a run that does nothing) never cancels an e2e run in progress.
concurrency:
    group: integration-${{ github.ref }}-${{ github.event.label.name || 'manual' }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    e2e:
        name: E2E Tests
        if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-e2e'
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - uses: actions/checkout@v7

            - name: Build image, start stack, create test user, install Playwright
              uses: ./.github/actions/e2e-stack
              with:
                  tag: e2e
                  container: kima-e2e
                  volume: kima_e2e_data

            - name: Run predeploy tests
              working-directory: frontend
              run: npm run test:predeploy
              env:
                  KIMA_TEST_USERNAME: ${{ env.KIMA_TEST_USERNAME }}
                  KIMA_TEST_PASSWORD: ${{ env.KIMA_TEST_PASSWORD }}
                  KIMA_UI_BASE_URL: http://127.0.0.1:3080

            - name: Run functional tests
              working-directory: frontend
              run: |
                  npx playwright test \
                    tests/e2e/smoke.spec.ts \
                    tests/e2e/queue.spec.ts \
                    tests/e2e/playlists.spec.ts \
                    tests/e2e/security.spec.ts \
                    tests/e2e/vibe.spec.ts \
                    tests/e2e/full-ux-audit.spec.ts \
                    --reporter=list
              env:
                  KIMA_TEST_USERNAME: ${{ env.KIMA_TEST_USERNAME }}
                  KIMA_TEST_PASSWORD: ${{ env.KIMA_TEST_PASSWORD }}
                  KIMA_UI_BASE_URL: http://127.0.0.1:3080

            - name: Upload test results on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-results-${{ github.run_id }}
                  path: |
                      frontend/test-results/
                      frontend/playwright-report/
                  retention-days: 7

            - name: Stop and remove stack
              if: always()
              uses: ./.github/actions/e2e-teardown
              with:
                  container: kima-e2e
                  volume: kima_e2e_data
