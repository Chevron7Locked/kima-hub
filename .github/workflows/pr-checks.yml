name: PR Checks

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened]

jobs:
    lint-frontend:
        name: Frontend Lint & Unit Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              working-directory: frontend
              run: npm ci

            - name: Run ESLint
              working-directory: frontend
              run: npm run lint

            # These 303 tests existed for months without ever running in CI --
            # nothing in any workflow referenced vitest. They take under a
            # second and this job has already paid for `npm ci`.
            - name: Run frontend unit tests
              working-directory: frontend
              run: npm run test:unit

    typecheck:
        name: TypeScript Typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Typecheck frontend
              working-directory: frontend
              run: |
                  npm ci
                  npm run typecheck

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Typecheck backend
              working-directory: backend
              run: |
                  npm ci
                  npm run typecheck

    unit-tests:
        name: Backend Unit Tests
        runs-on: ubuntu-latest
        # The social integration suite (vibeProfile/social/socialProfile) needs a
        # real Postgres with pgvector -- not stock postgres, `vibe.fused_track`'s
        # v3 column is a vector type. DATABASE_URL below is the same
        # test/test@localhost:5433/test that backend/src/__mocks__/test-env.cjs
        # falls back to for local dev (see test-db-defaults.cjs), so this job
        # doesn't need its own separate credentials to keep in sync.
        services:
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: test
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd "pg_isready -U test -d test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DATABASE_URL: postgresql://test:test@localhost:5433/test
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              working-directory: backend
              run: npm ci

            - name: Apply database migrations
              working-directory: backend
              run: npx prisma migrate deploy

            - name: Run Jest
              working-directory: backend
              # Exclude webhookEventStore -- it is an integration test requiring
              # a live PostgreSQL database. It runs in integration.yml instead.
              # (Unrelated to the Postgres service above, which now covers the
              # vibeProfile/social/socialProfile integration suite instead --
              # see backend/src/__mocks__/test-global-setup.cjs for the one
              # thing a fresh database here still doesn't have: the vibe-engine's
              # OWN tables, not owned by these migrations. It bootstraps a
              # minimal stand-in; see that file's comment for the real boundary.)
              run: npm test -- --passWithNoTests --testPathIgnorePatterns="webhookEventStore"

    build-docker:
        name: Docker Build Check
        runs-on: ubuntu-latest
        needs: [lint-frontend, typecheck, unit-tests]
        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image (no push)
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: false
                  tags: kima:pr-check
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
