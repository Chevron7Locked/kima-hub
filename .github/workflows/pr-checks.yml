name: PR Checks

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened]

# A newer push to the same pull request replaces the run in progress.
concurrency:
    group: pr-checks-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint-frontend:
        name: Frontend Lint & Unit Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              working-directory: frontend
              run: npm ci

            - name: Run ESLint
              working-directory: frontend
              run: npm run lint

            - name: Run frontend unit tests
              working-directory: frontend
              run: npm run test:unit

    typecheck:
        name: TypeScript Typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Typecheck frontend
              working-directory: frontend
              run: |
                  npm ci
                  npm run typecheck

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Typecheck backend
              working-directory: backend
              run: |
                  npm ci
                  npm run typecheck

    unit-tests:
        name: Backend Unit Tests
        runs-on: ubuntu-latest
        # The tests need Postgres with pgvector, not stock postgres:
        # track_embeddings.embedding is a vector column. DATABASE_URL below names
        # kima_v1_test, the same database name backend/src/__mocks__/test-db-defaults.cjs
        # falls back to locally; the test setup creates and migrates it itself.
        services:
            postgres:
                image: pgvector/pgvector:0.8.6-pg16
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: kima_v1_test
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd "pg_isready -U test -d kima_v1_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            # Queues, locks and the analyzers' report secret run on a real Redis in the tests too.
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DATABASE_URL: postgresql://test:test@localhost:5433/kima_v1_test
            REDIS_URL: redis://localhost:6379
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              working-directory: backend
              run: npm ci

            - name: Run Jest
              working-directory: backend
              run: npm test -- --passWithNoTests

    python-analyzer-tests:
        name: Python Analyzer Tests
        runs-on: ubuntu-latest
        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            REDIS_URL: redis://localhost:6379
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v7
              with:
                  # Last CPython with numpy 1.24.4 wheels (see the pin below).
                  python-version: "3.11"

            - name: Install test dependencies
              # numpy==1.24.4 is what the shipped image pins. redis + psycopg2-binary
              # cover analyzer.py's module-level imports; the tests fake everything
              # else and need no model weights.
              run: |
                  python -m pip install --upgrade pip
                  pip install "numpy==1.24.4" redis psycopg2-binary pytest
                  sudo apt-get update && sudo apt-get install -y ffmpeg

            - name: Run analyzer tests that need no model weights
              working-directory: services/audio-analyzer
              # Every test file here; ffmpeg drives the decode tests (stereo split, bad frames, channel downmix).
              # test_bpm_confidence_real.py is a manual check against real recordings, run by hand.
              run: python -m pytest -v --ignore=test_bpm_confidence_real.py

            - name: Install the sound-vector analyzer's dependencies
              run: pip install -r services/audio-analyzer-clap/requirements.txt

            - name: Run sound-vector analyzer tests that need no model weights
              working-directory: services/audio-analyzer-clap
              # The eager-load test needs the model weights, and the music model's parity
              # test skips its checks without the checkpoint and torch (it still proves the
              # front end imports no torch); the image build runs verify_runtime.py against
              # the real model.
              # Every test file here; eval/ is the lab's tooling, not tests.
              run: >-
                  python -m pytest -v --ignore=eval
                  --deselect test_onnx_runtime_ready.py::test_ensure_onnx_backend_eagerly_loads_model

    build-docker:
        name: Docker Build Check
        runs-on: ubuntu-latest
        needs: [lint-frontend, typecheck, unit-tests]
        steps:
            - uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build Docker image (no push)
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: false
                  tags: kima:pr-check
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build the compose audio analyzer image (no push)
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: services/audio-analyzer/Dockerfile
                  push: false
                  tags: kima-audio-analyzer:pr-check
                  cache-from: type=gha,scope=audio-analyzer
                  cache-to: type=gha,mode=max,scope=audio-analyzer
