name: Weekly ARM Checks

# The image boots on a native ARM runner and its vendored MusiCNN models still match a fresh conversion of their
# committed sources. The full end-to-end suite is not run here: it needs a real music library, which CI does not
# have; the release gate runs it on a full stack.

on:
    schedule:
        - cron: "0 3 * * 0"
    workflow_dispatch:

concurrency:
    group: weekly-arm
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    arm64-smoke:
        name: ARM64 native boot check
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 45
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build image (native arm64)
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  push: false
                  load: true
                  tags: kima:arm64-smoke
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Boot and verify the analyzer
              shell: bash
              run: |
                  docker run -d \
                    --name kima-arm64-smoke \
                    -p 3031:3030 \
                    -v kima_arm64_smoke_data:/data \
                    kima:arm64-smoke
                  timeout 180 bash -c 'until curl -sf http://localhost:3031/api/health; do sleep 3; done'
                  docker exec kima-arm64-smoke supervisorctl status audio-analyzer | grep -q RUNNING
                  # The analyzer pool is lazy (workers start with the first job),
                  # so its boot log proves nothing on an empty container. Make
                  # the analyzer's own MusiCNN module prove the vendored models
                  # inside the running image, on its own ONNX Runtime.
                  docker exec kima-arm64-smoke python3 -c "
                  import sys; sys.path.insert(0, '/app/audio-analyzer')
                  from musicnn_onnx import MusicnnBody, mel_patches, gate_signal
                  import numpy as np
                  body = MusicnnBody('/app/models', use_gpu=False, threads=2)
                  got = body.run(mel_patches(gate_signal()))
                  expected = np.load('/app/models/musicnn-answers.npz')['musicnn']
                  cos = ((got*expected).sum(1)/np.linalg.norm(got,axis=1)/np.linalg.norm(expected,axis=1)).min()
                  print(f'MusiCNN gate cosine: {cos:.7f} (min 0.99999)')
                  assert cos >= 0.99999, 'vendored models drifted from the recorded answers'
                  " 2>&1 | tee /tmp/arm64-boot.log
                  docker logs kima-arm64-smoke 2>&1 | tail -20 >> /tmp/arm64-boot.log

            - name: Upload boot log
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: arm64-smoke-log-${{ github.run_id }}
                  path: /tmp/arm64-boot.log
                  retention-days: 14

            - name: Stop stack
              if: always()
              run: |
                  docker rm -f kima-arm64-smoke
                  docker volume rm kima_arm64_smoke_data

    musicnn-reproof:
        name: Re-derive vendored MusiCNN ONNX
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 30
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7

            # Re-derives the vendored ONNX from the frozen .pb sources and gates
            # it against the vendored reference answers, on the architecture the
            # conversion is hardest on. If the committed ONNX ever drifts from
            # what the converter produces from the committed sources, this job
            # fails. The image builds themselves no longer run the converter
            # (the ONNX is vendored); this keeps the proof alive.
            - name: Convert and gate
              shell: bash
              run: |
                  cd services/audio-analyzer
                  docker build \
                    -f ci-reprove.Dockerfile -t musicnn-reproof . \
                    || { echo "::error::vendored ONNX does not match a fresh conversion of the committed .pb sources"; exit 1; }

    report-failure:
        name: Open an issue on failure
        needs: [arm64-smoke, musicnn-reproof]
        if: failure() && github.event_name == 'schedule'
        runs-on: ubuntu-latest
        permissions:
            issues: write
        steps:
            - uses: actions/github-script@v9
              with:
                  script: |
                      // One open issue per failing check: a repeat failure comments on it instead of opening another.
                      const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                      const open = await github.paginate(github.rest.issues.listForRepo, {
                        owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'ci',
                      });
                      const existing = open.find((i) => i.title.startsWith('Weekly ARM checks failed'));
                      if (existing) {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                          body: `Failed again on ${context.sha}.\n\nRun: ${run}`,
                        });
                      } else {
                        await github.rest.issues.create({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          title: `Weekly ARM checks failed -- ${new Date().toISOString().split('T')[0]}`,
                          body: `The weekly ARM checks failed on ${context.sha}.\n\nRun: ${run}`,
                          labels: ['bug', 'ci']
                        });
                      }
