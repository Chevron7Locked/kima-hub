# =============================================================================
# Supervisor Configuration for Kima Multi-Service Orchestration
# =============================================================================

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

# =============================================================================
# Database Services (Priority 10-20)
# =============================================================================

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /data/postgres
user=postgres
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:redis]
command=/usr/bin/redis-server --dir /data/redis --appendonly yes
user=redis
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

# =============================================================================
# Application Services (Priority 30-40)
# =============================================================================

[program:backend]
command=/bin/bash -c "/app/wait-for-db.sh 120 && cd /app/backend && node dist/index.js"
user=kima
autostart=true
autorestart=true
startretries=3
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
directory=/app/backend
priority=30

[program:frontend]
command=/bin/bash -c "sleep 10 && cd /app/frontend && npm start"
user=kima
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",BACKEND_URL="http://localhost:3006",PORT="3030",MALLOC_ARENA_MAX="1",NODE_OPTIONS="--max-old-space-size=512"
priority=40

# =============================================================================
# Analysis Workers (Priority 50-60)
# =============================================================================

[program:audio-analyzer]
command=/bin/bash -c "/app/wait-for-db.sh 120 && cd /app/audio-analyzer && python3 analyzer.py"
user=kima
autostart=true
autorestart=true
startretries=3
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DATABASE_URL="postgresql://kima:kima@localhost:5432/kima",REDIS_URL="redis://localhost:6379",MUSIC_PATH=%(ENV_KIMA_MUSIC_PATH)s,BATCH_SIZE=%(ENV_KIMA_AUDIO_ANALYZER_BATCH_SIZE)s,SLEEP_INTERVAL=%(ENV_KIMA_AUDIO_ANALYZER_SLEEP_INTERVAL)s,MAX_ANALYZE_SECONDS=%(ENV_KIMA_AUDIO_ANALYZER_MAX_ANALYZE_SECONDS)s,BRPOP_TIMEOUT=%(ENV_KIMA_AUDIO_ANALYZER_BRPOP_TIMEOUT)s,MODEL_IDLE_TIMEOUT=%(ENV_KIMA_AUDIO_ANALYZER_MODEL_IDLE_TIMEOUT)s,NUM_WORKERS=%(ENV_KIMA_AUDIO_ANALYZER_NUM_WORKERS)s,THREADS_PER_WORKER=%(ENV_KIMA_AUDIO_ANALYZER_THREADS_PER_WORKER)s,XDG_CACHE_HOME="/data/cache/audio-analyzer"
priority=50

[program:audio-analyzer-clap]
command=/bin/bash -c "/app/wait-for-db.sh 120 && cd /app/audio-analyzer-clap && python3 analyzer.py"
user=kima
autostart=%(ENV_KIMA_CLAP_ENABLED)s
autorestart=true
startretries=3
startsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DATABASE_URL="postgresql://kima:kima@localhost:5432/kima",REDIS_URL="redis://localhost:6379",MUSIC_PATH=%(ENV_KIMA_MUSIC_PATH)s,BACKEND_URL="http://localhost:3006",SLEEP_INTERVAL=%(ENV_KIMA_CLAP_SLEEP_INTERVAL)s,NUM_WORKERS=%(ENV_KIMA_CLAP_NUM_WORKERS)s,MODEL_IDLE_TIMEOUT=%(ENV_KIMA_CLAP_MODEL_IDLE_TIMEOUT)s,INTERNAL_API_SECRET="kima-internal-aio",XDG_CACHE_HOME="/data/cache/clap"
priority=60
